let inpageID = 1276;

var AdManager = window.AdManager || [];
let pubID = adver.qs.source;

    fetch('https://vast.yomeno.xyz/s/tubecorp/embed?source=' + pubID)
    .then(res => res.json())
    .then(data => {
        if(data.campaign && data.campaign.inpage_allowed) {
            resolve(true);
        }
		resolve(false);
    });
});

const getCustomPublisher = new Promise((resolve, reject) => {
    fetch('https://js.wpushsdk.com/npc/embed.json')
    .then(res => res.json())
    .then(data => {
        console.log(data)
        for (const key in data) {
            if(key == pubID) {
                inpageID = data[key];
                resolve(true);
            }
        }
        resolve(false);
    })
})

function initInapge() {
    return Promise
            .all([getPublisher, getCustomPublisher])
            .then(([enable, custom]) => {
                if(enable) return true;
				        return false;
            })
}
    
async function initAdManager() {

    let enableInpage = false;
    if(adver.qs.source > 0) {
      enableInpage = await initInapge();
    } 

    AdManager.push(function() {
      var rawConfig = AdManager.getLocalConfig();
